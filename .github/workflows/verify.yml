name: Verify
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 26
          cache: npm
      - name: Python analysis tools
        run: |
          python -m pip install uv==0.13.10
          uv sync --project scripts/performance --locked
          uv run --project scripts/performance --locked ruff check scripts/performance
          uv run --project scripts/performance --locked ruff format --check scripts/performance
          uv run --project scripts/performance --locked python -m py_compile scripts/performance/analyze_heap.py scripts/performance/plot_stability.py
          MPLCONFIGDIR="$RUNNER_TEMP/matplotlib" uv run --project scripts/performance --locked python scripts/performance/plot_stability.py docs/stability-results.json "$RUNNER_TEMP/stability-memory.png"
      - run: npm ci
      - run: npm run check
      - run: npm run format:check
      - run: npm test
      - run: node --expose-gc scripts/performance/retention.mjs
      - run: npm run build
      - run: npm audit --audit-level=moderate
      - name: Local Worker integration
        shell: bash
        run: |
          npm run dev:server -- --persist-to "$RUNNER_TEMP/tichu6-state" > "$RUNNER_TEMP/worker.log" 2>&1 &
          worker_pid=$!
          trap 'kill "$worker_pid" 2>/dev/null || true' EXIT
          for attempt in {1..30}; do
            if curl --fail --silent http://localhost:8787/health >/dev/null; then break; fi
            sleep 1
          done
          if ! curl --fail --silent http://localhost:8787/health >/dev/null; then
            cat "$RUNNER_TEMP/worker.log"
            exit 1
          fi
          npm run test:server || { cat "$RUNNER_TEMP/worker.log"; exit 1; }
      - run: npm run test:idle
      - run: npm run test:flow
